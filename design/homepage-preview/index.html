<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snippysaurus · Homepage directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e7e3;font-family:Arial,sans-serif;color:#fff}.review{min-height:88px;background:#202b24;display:flex;align-items:center;justify-content:space-between;padding:16px 25px;gap:16px}.label{font-size:13px;font-weight:bold;white-space:nowrap}.label small{display:block;color:#b5c4b7;font-size:11px;font-weight:normal;margin-top:6px}.choices,.sizes{display:flex;gap:5px}button{border:1px solid #ffffff25;color:#d8e0da;border-radius:9px;background:transparent;padding:11px 15px;cursor:pointer;font-size:12px;font-weight:bold}button[aria-pressed=true]{background:#dcf5a4;color:#203b23;border-color:#dcf5a4}.sizes button{font-size:11px;padding:10px}.caption{background:#fff;color:#586151;font-size:12px;padding:11px 20px;text-align:center;border-bottom:1px solid #d9ddd5}iframe{display:block;width:100%;height:calc(100dvh - 125px);border:0;background:#faf9f5;margin:auto;transition:width .2s}body.mobile iframe{width:390px;max-width:100%;height:calc(100dvh - 149px);margin-top:12px;border-radius:20px;box-shadow:0 8px 40px #26362625}@media(max-width:780px){.review{padding:12px;flex-wrap:wrap;gap:10px}.label{width:100%;display:flex;justify-content:space-between}.label small{margin:0}.choices{flex:1;flex-wrap:wrap}.choices button{padding:10px;min-width:40%;font-size:11px;flex:1}.sizes{display:none}.caption{font-size:11px}iframe{height:calc(100dvh - 135px)}}
</style></head><body>
<header class="review"><div class="label">SNIPPY / DESIGN REVIEW<small>Interactive concepts · Nothing is live</small></div><div class="choices" aria-label="Design direction"><button data-mode="d" aria-pressed="true">Refined · Swipe to choose</button><button data-mode="a" aria-pressed="false">A · The card deck</button><button data-mode="b" aria-pressed="false">B · The spotlight</button><button data-mode="c" aria-pressed="false">C · The chat room</button></div><div class="sizes" aria-label="Preview size"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button></div></header>
<div class="caption" id="caption">Refined · Your centered chat layout. Swipe or drag the portraits to choose a different speaker.</div>
<iframe title="Interactive homepage preview" src="concept.html?mode=d"></iframe>
<script>const captions={d:'Refined · Your centered chat layout. Swipe or drag the portraits to choose a different speaker.',a:'A · Playful, photo-first, and immediately obvious. Pick a person, then find a clip. Recommended.',b:'B · One big personality in the spotlight. A bold editorial layout with the chat front and center.',c:'C · A dedicated chat workspace. Speakers stay close by as the conversation grows.'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('iframe').src='concept.html?mode='+b.dataset.mode;document.getElementById('caption').textContent=captions[b.dataset.mode];});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.body.classList.toggle('mobile',b.dataset.size==='mobile');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});</script>
</body></html>
